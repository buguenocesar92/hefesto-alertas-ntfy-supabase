x-pg: &pg
  PGHOST: ${DB_HOST:?Configurar DB_HOST}
  PGPORT: "${DB_PORT:-5432}"
  PGDATABASE: ${DB_NAME:-postgres}
  PGUSER: ${DB_USER:-ntfy_app}
  PGPASSWORD: ${DB_PASSWORD:?Configurar clave}
  PGSSLMODE: ${DB_SSLMODE:-verify-full}
  PGSSLROOTCERT: ${PGSSLROOTCERT-/certs/ca.crt}
  PGCONNECT_TIMEOUT: "15"
services:
  preflight:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: "no"
    networks: [alertas, egreso]
    environment:
      <<: *pg
      SUPABASE_DEDICATED_CONFIRMED: ${SUPABASE_DEDICATED_CONFIRMED:-false}
      SUPABASE_DATA_API_DISABLED: ${SUPABASE_DATA_API_DISABLED:-false}
    volumes: [./certs:/certs:ro, ./ops:/opt/hefesto:ro]
    entrypoint: [sh, /opt/hefesto/preflight.sh]
  permissions:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: "no"
    user: "0"
    networks: [alertas]
    volumes: [files:/files]
  app:
    image: binwiederhier/ntfy:v2.30.0@sha256:8563a39da2f5a47360618b2ab9200239c76b37f4145f6d627d9ab4368abd23f0
    user: "1000:1000"
    command: [serve, --config, /etc/ntfy/server.yml]
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      preflight: {condition: service_completed_successfully}
      permissions: {condition: service_completed_successfully}
    networks: [alertas, egreso]
    environment:
      NTFY_BASE_URL: ${PUBLIC_URL:?Configurar URL}
      NTFY_DATABASE_URL: postgres://${DB_USER:-ntfy_app}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-postgres}?sslmode=${DB_SSLMODE:-verify-full}&sslrootcert=${PGSSLROOTCERT-/certs/ca.crt}&connect_timeout=15&pool_max_conns=5&pool_max_idle_conns=2
      NTFY_WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      NTFY_WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      NTFY_WEB_PUSH_EMAIL_ADDRESS: ${WEB_PUSH_EMAIL_ADDRESS:-}
      NTFY_BEHIND_PROXY: ${NTFY_BEHIND_PROXY:-false}
      NTFY_PROXY_TRUSTED_HOSTS: ${NTFY_PROXY_TRUSTED_HOSTS:-}
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:8080/v1/health | grep -q '\"healthy\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes: [files:/var/lib/ntfy, ./config.yml:/etc/ntfy/server.yml:ro, ./certs:/certs:ro]
  dbtools:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [tools]
    networks: [alertas, egreso]
    environment: *pg
    volumes: [./certs:/certs:ro, ./ops:/opt/hefesto:ro]
  filetools:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [tools]
    user: "0"
    networks: [alertas]
    volumes: [files:/files]
networks:
  alertas: {}
  egreso: {}
volumes:
  files: {}
